<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что дальше? Гид выпускника</title>
<meta name="description" content="Одностраничный гид для выпускников вузов Казахстана: магистратура, гранты, курсы, стажировки, наставники и план первых 12 месяцев.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8f0; --bg2:#ffffff; --ink:#1f2a44; --muted:#5d6785; --line:#f0e3d4;
  --brand:#ff7a3d; --brand-ink:#b8400b; --brand-soft:#ffe7d8;
  --teal:#12a594; --teal-soft:#d9f4ef; --sun:#ffc531; --sun-soft:#fff2c9;
  --violet:#7c5cff; --violet-soft:#e9e3ff; --pink-soft:#ffe1ea;
  --shadow:0 10px 30px rgba(31,42,68,.08); --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a2b; --bg2:#1d2540; --ink:#f3f1ec; --muted:#a9b2cf; --line:#2c3558;
    --brand:#ff8f5a; --brand-ink:#ffb08a; --brand-soft:#3a2a2a;
    --teal:#37d2bf; --teal-soft:#14383a; --sun:#ffd25e; --sun-soft:#3b3416;
    --violet:#a38dff; --violet-soft:#2b2753; --pink-soft:#3b2336;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141a2b; --bg2:#1d2540; --ink:#f3f1ec; --muted:#a9b2cf; --line:#2c3558;
  --brand:#ff8f5a; --brand-ink:#ffb08a; --brand-soft:#3a2a2a;
  --teal:#37d2bf; --teal-soft:#14383a; --sun:#ffd25e; --sun-soft:#3b3416;
  --violet:#a38dff; --violet-soft:#2b2753; --pink-soft:#3b2336;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
h1,h2,h3,h4{line-height:1.15;margin:0;font-weight:900;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:8px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
section{padding:72px 0;scroll-margin-top:70px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:6px 14px;border-radius:99px;margin-bottom:14px}
.sec-head{max-width:720px;margin-bottom:32px}
.sec-head h2{font-size:clamp(1.8rem,4.5vw,2.7rem);margin-bottom:10px}
.sec-head p{color:var(--muted);font-size:1.08rem}

/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:62px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.15rem;text-decoration:none;margin-right:auto}
.logo i{font-style:normal;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--sun));font-size:1.2rem}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:800;font-size:.85rem;padding:5px 11px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:800;text-decoration:none;padding:13px 24px;border-radius:99px;background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(255,122,61,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--bg2);color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.sm{padding:8px 16px;font-size:.92rem;box-shadow:none}
.btn.menu{background:var(--ink);color:var(--bg);padding:8px 16px;box-shadow:none;font-size:.92rem}
#menuPanel{position:fixed;inset:62px 0 auto 0;z-index:49;background:var(--bg2);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:18px 0 24px}
#menuPanel[hidden]{display:none}
#menuPanel ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#menuPanel a{display:flex;gap:8px;align-items:center;text-decoration:none;font-weight:800;padding:10px 14px;border-radius:14px;background:var(--bg)}
#menuPanel a:hover{background:var(--brand-soft)}

/* hero */
.hero{padding:56px 0 40px;position:relative;overflow:hidden}
.hero .wrap{display:grid;gap:36px;grid-template-columns:1.15fr .85fr;align-items:center}
.hero h1{font-size:clamp(2.3rem,6.4vw,4.2rem);margin-bottom:18px}
.hero h1 mark{background:linear-gradient(transparent 60%,var(--sun) 60%);color:inherit;padding:0 4px}
.hero p.lead{font-size:1.2rem;color:var(--muted);max-width:560px;margin-bottom:26px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.stats{display:flex;flex-wrap:wrap;gap:12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:10px 18px}
.stat b{display:block;font-size:1.6rem;font-weight:900;color:var(--brand-ink)}
.stat span{font-size:.85rem;color:var(--muted);font-weight:700}
.blob{position:relative;min-height:340px}
.blob .c{position:absolute;background:var(--bg2);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:14px 18px;font-weight:800;display:flex;gap:10px;align-items:center;animation:float 6s ease-in-out infinite}
.blob .c small{display:block;font-weight:600;color:var(--muted)}
.blob .c .e{font-size:2rem}
.blob .c:nth-child(1){top:0;left:6%;background:var(--teal-soft)}
.blob .c:nth-child(2){top:70px;right:0;background:var(--sun-soft);animation-delay:-1.5s}
.blob .c:nth-child(3){top:170px;left:0;background:var(--violet-soft);animation-delay:-3s}
.blob .c:nth-child(4){top:250px;right:8%;background:var(--pink-soft);animation-delay:-4.5s}
@keyframes float{50%{transform:translateY(-10px)}}

/* cards */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.card,.blob .c{animation:none}html{scroll-behavior:auto}}
.card h3{font-size:1.2rem}
.card p{color:var(--muted);font-size:.97rem}
.card .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:var(--brand-soft)}
.card .foot{margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tag{display:inline-block;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--teal-soft);color:var(--ink)}
.tag.o{background:var(--brand-soft)} .tag.y{background:var(--sun-soft)} .tag.v{background:var(--violet-soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.lnk{font-weight:900;color:var(--brand-ink);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.lnk:hover{text-decoration:underline}
.paths .card:nth-child(6n+1) .ico{background:var(--brand-soft)}
.paths .card:nth-child(6n+2) .ico{background:var(--teal-soft)}
.paths .card:nth-child(6n+3) .ico{background:var(--sun-soft)}
.paths .card:nth-child(6n+4) .ico{background:var(--violet-soft)}
.paths .card:nth-child(6n+5) .ico{background:var(--pink-soft)}
.paths .card:nth-child(6n+6) .ico{background:var(--teal-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:2px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;font-weight:800;font-size:.92rem;padding:7px 16px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.money{letter-spacing:.1em}
.note{margin-top:20px;font-size:.92rem;color:var(--muted);background:var(--sun-soft);padding:12px 16px;border-radius:14px}

/* illustrations */
.cover{margin:-22px -22px 6px;height:112px;border-radius:var(--radius) var(--radius) 0 0;position:relative;overflow:hidden;display:grid;place-items:center}
.cover svg.pat{position:absolute;inset:0;width:100%;height:100%}
.cover .big{position:relative;font-size:3rem;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.cover .flag{position:absolute;right:12px;bottom:8px;font-size:1.3rem;background:rgba(255,255,255,.85);border-radius:99px;padding:0 8px;line-height:1.6}
.avatar svg{width:100%;height:100%;border-radius:50%;display:block}
.avatar{overflow:hidden;background:none}
.hero-art{position:relative}
.hero-art svg.scene{width:100%;height:auto;display:block;border-radius:32px;box-shadow:var(--shadow)}
.hero-art .c{position:absolute;background:var(--bg2);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:8px 14px;font-weight:800;font-size:.92rem;display:flex;gap:8px;align-items:center;animation:float 6s ease-in-out infinite}
.hero-art .c:nth-of-type(1){top:6%;left:-4%}
.hero-art .c:nth-of-type(2){top:20%;right:-3%;animation-delay:-2s}
.hero-art .c:nth-of-type(3){bottom:8%;left:2%;animation-delay:-4s}
.gallery{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:34px}
.gallery figure{margin:0;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:4/3;box-shadow:var(--shadow)}
.gallery svg{width:100%;height:100%;display:block}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-weight:800}
.tag.g{background:#d6f5d6;color:#14501f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.g{background:#1d4a2a;color:#d6f5d6}}

/* alt backgrounds */
.band{background:var(--bg2);border-block:1px solid var(--line)}

/* quiz */
.quiz{background:linear-gradient(135deg,var(--brand-soft),var(--violet-soft));border-radius:32px;padding:clamp(22px,4vw,44px);max-width:860px}
.quiz h3{font-size:1.5rem;margin-bottom:6px}
.bar{height:8px;background:rgba(0,0,0,.08);border-radius:9px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .3s}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{text-align:left;font:inherit;font-weight:800;border:2px solid transparent;background:var(--bg2);color:var(--ink);padding:14px 18px;border-radius:16px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--brand);transform:translateX(4px)}
.res{display:grid;gap:12px;margin-top:16px}
.res .r{background:var(--bg2);border-radius:18px;padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.res .r .ico{font-size:2rem}
.res .r div{flex:1;min-width:180px}
.res .r b{display:block;font-size:1.1rem}

/* stories */
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;font-weight:900;color:#fff}
.story q{display:block;font-style:italic;color:var(--ink);quotes:"«" "»"}
.person{display:flex;gap:14px;align-items:center}
.person small{color:var(--muted);font-weight:700;display:block}
.arrow{display:flex;gap:8px;align-items:center;font-weight:800;font-size:.92rem;flex-wrap:wrap}
.arrow span{background:var(--bg);padding:3px 10px;border-radius:99px;border:1px solid var(--line)}

/* pricing */
.seg.cur{display:inline-flex;margin-bottom:22px}
.price{font-size:2rem;font-weight:900;color:var(--brand-ink)}
.price small{font-size:.9rem;color:var(--muted);font-weight:700}
.card.feat{border:3px solid var(--brand);position:relative}
.card.feat::before{content:attr(data-badge);position:absolute;top:-14px;right:20px;background:var(--brand);color:#fff;font-weight:900;font-size:.8rem;padding:4px 14px;border-radius:99px}
.card ul{margin:0;padding-left:20px;color:var(--muted);font-size:.95rem}
.card ul li{margin:3px 0}
table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-top:34px}
caption{text-align:left;font-weight:900;font-size:1.25rem;padding:0 0 12px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--brand-soft);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}

/* roadmap */
.road{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.step{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.step h3{font-size:1.1rem;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.step h3 i{font-style:normal;background:var(--teal);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:.9rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;font-weight:600}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--brand);flex:none}
.check input:checked+span{text-decoration:line-through;color:var(--muted)}
.progress{display:flex;gap:14px;align-items:center;margin-bottom:22px;font-weight:800}
.progress .bar{flex:1;margin:0;height:12px}

/* faq */
details{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:4px 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:800;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.5rem;color:var(--brand);line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);padding-bottom:16px}

/* contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
form{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);display:grid;gap:14px}
label{font-weight:800;font-size:.92rem;display:grid;gap:6px}
input[type=text],input[type=email],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
textarea{min-height:100px;resize:vertical}
.thanks{color:var(--teal);font-weight:800;display:none}
footer{padding:36px 0 50px;border-top:1px solid var(--line);color:var(--muted);font-size:.93rem}
footer .wrap{display:grid;gap:10px}

@media (max-width:860px){
  .hero .wrap,.contact-grid{grid-template-columns:1fr}
  .blob{min-height:300px}
  section{padding:52px 0}
  .logo span{display:none}
}
@media (max-width:420px){ body{font-size:16px} .btn{padding:12px 18px} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Что дальше?"><i>🧭</i><span data-i18n="brand"></span></a>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="ru" aria-pressed="true">RU</button>
      <button data-lang="kz" aria-pressed="false">KZ</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="btn menu" id="menuBtn" aria-expanded="false" aria-controls="menuPanel"><span data-i18n="menu"></span> ☰</button>
  </div>
  <nav id="menuPanel" hidden><div class="wrap"><ul id="menuList"></ul></div></nav>
</header>

<main id="top">

<!-- 1. HERO -->
<div class="hero">
  <div class="wrap">
    <div>
      <span class="eyebrow">🎓 <span data-i18n="hero_eyebrow"></span></span>
      <h1 data-i18n-html="hero_title"></h1>
      <p class="lead" data-i18n="hero_lead"></p>
      <div class="cta">
        <a class="btn" href="#quiz" data-i18n="hero_cta1"></a>
        <a class="btn ghost" href="#paths" data-i18n="hero_cta2"></a>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <svg class="scene" viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9b8"/><stop offset="1" stop-color="#fff2d9"/></linearGradient>
          <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd1b8"/><stop offset="1" stop-color="#12a594"/></linearGradient>
        </defs>
        <rect width="520" height="420" fill="url(#sky)"/>
        <circle cx="400" cy="90" r="46" fill="#ffc531"/>
        <circle cx="400" cy="90" r="64" fill="#ffc531" opacity=".25"/>
        <g fill="#fff" opacity=".9"><ellipse cx="110" cy="80" rx="46" ry="16"/><ellipse cx="140" cy="68" rx="30" ry="14"/><ellipse cx="300" cy="140" rx="40" ry="12"/></g>
        <path d="M0 290 Q120 200 250 270 T520 250 V420 H0Z" fill="url(#h1)"/>
        <path d="M0 340 Q160 270 300 330 T520 320 V420 H0Z" fill="#0d8576"/>
        <path d="M250 420 C250 380 230 360 270 330 C300 308 260 290 285 262" stroke="#fff2d9" stroke-width="22" fill="none" stroke-linecap="round" opacity=".9"/>
        <!-- signpost -->
        <rect x="372" y="170" width="10" height="190" rx="4" fill="#8a5a3c"/>
        <g font-family="Nunito,sans-serif" font-weight="800" font-size="14" fill="#fff">
          <path d="M382 180 h92 l16 16 -16 16 h-92z" fill="#ff7a3d"/><text x="392" y="202">Master's</text>
          <path d="M372 222 h-92 l-16 16 16 16 h92z" fill="#7c5cff"/><text x="288" y="244">Jobs</text>
          <path d="M382 264 h92 l16 16 -16 16 h-92z" fill="#e0457b"/><text x="392" y="286">Courses</text>
        </g>
        <!-- graduate -->
        <g transform="translate(130 150)">
          <path d="M-14 170 L-22 100 Q0 78 22 100 L14 170Z" fill="#1f2a44"/>
          <path d="M-22 100 L-52 62" stroke="#1f2a44" stroke-width="16" stroke-linecap="round"/>
          <path d="M22 100 L52 58" stroke="#1f2a44" stroke-width="16" stroke-linecap="round"/>
          <circle cx="-54" cy="58" r="9" fill="#f2c29b"/><circle cx="54" cy="54" r="9" fill="#f2c29b"/>
          <circle cx="0" cy="62" r="26" fill="#f2c29b"/>
          <path d="M-26 58 Q-24 34 0 34 Q24 34 26 58 Q10 46 -26 58Z" fill="#3a2418"/>
          <circle cx="-9" cy="64" r="3" fill="#1f2a44"/><circle cx="9" cy="64" r="3" fill="#1f2a44"/>
          <path d="M-8 74 Q0 82 8 74" stroke="#b5533a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M-40 34 L0 14 L40 34 L0 54Z" fill="#14213d"/>
          <path d="M-22 44 V58 Q0 68 22 58 V44 L0 54Z" fill="#0d1730"/>
          <path d="M34 36 V62" stroke="#ffc531" stroke-width="3"/><circle cx="34" cy="64" r="4" fill="#ffc531"/>
          <rect x="-14" y="164" width="12" height="22" rx="4" fill="#14213d"/><rect x="2" y="164" width="12" height="22" rx="4" fill="#14213d"/>
        </g>
        <g fill="#ffc531"><path d="M60 120 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/><path d="M230 70 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#ff7a3d"/></g>
      </svg>
      <div class="c"><span>📚</span><span id="b1"></span></div>
      <div class="c"><span>💼</span><span id="b2"></span></div>
      <div class="c"><span>🌍</span><span id="b3"></span></div>
    </div>
  </div>
</div>

<!-- 2. PATHS -->
<section id="paths"><div class="wrap">
  <div class="sec-head"><span class="eyebrow">🗺️ <span data-i18n="paths_eb"></span></span><h2 data-i18n="paths_h"></h2><p data-i18n="paths_p"></p></div>
  <div class="grid paths" id="pathsGrid"></div>
  <div class="gallery" id="gallery" role="presentation"></div>
</div></section>

}

}
function renderMen(){
  $('#menGrid').innerHTML=MEN.map((m,i)=>`<article class="card" style="animation-delay:${i*50}ms"><div class="person"><div class="avatar">${avatar(PAL[hash(m.nm)%PAL.length][0],m.nm)}</div><div><h3>${m.nm}</h3><small>${tr(m.r)}</small></div></div><p>${tr(m.a)}</p><div class="tags"><span class="tag">🗣 ${m.l}</span><span class="tag o">${money(m.p)} ${tr(UI.per)}</span></div><p>📞 ${m.ph}<br>✉️ ${m.m}</p><div class="foot"><a class="btn sm" href="mailto:${m.m}?subject=${encodeURIComponent(tr(UI.brand))}">${tr(UI.write)}</a><button class="btn sm ghost" data-copy="${m.m}">${tr(UI.copy)}</button></div></article>`).join('');
}
function renderPrc(){
  $('#prcGrid').innerHTML=PRC.map((p,i)=>`<article class="card${p.feat?' feat':''}" ${p.feat?`data-badge="${tr(UI.badge)}"`:''} style="animation-delay:${i*50}ms"><div class="ico">${p.e}</div><h3>${tr(p.n)}</h3><div class="price">${money(p.v)}${p.v?` <small>/ ${tr(p.sub)}</small>`:''}</div><ul>${p.li.map(x=>`<li>${tr(x)}</li>`).join('')}</ul></article>`).join('');
  $('#costBody').innerHTML=COST.map(c=>`<tr><td>${tr(c[0])}</td><td>${usd(c[1],c[2])}</td></tr>`).join('');
}
const loadRoad=()=>{try{return JSON.parse(store.get('roadDone')||'{}')}catch(e){return {}}};
function renderRoad(){
  const done=loadRoad();
  let total=0,n=0;
  $('#roadGrid').innerHTML=ROAD.map((s,si)=>`<div class="step"><h3><i>${si+1}</i>${tr(s.t)}</h3>${s.i.map((it,ii)=>{const id=si+'-'+ii;total++;if(done[id])n++;return `<label class="check"><input type="checkbox" data-road="${id}" ${done[id]?'checked':''}><span>${tr(it)}</span></label>`}).join('')}</div>`).join('');
  updRoad(n,total);
}
function updRoad(n,total){
  $('#rdLabel').textContent=`${tr(UI.rd_done)}: ${n}/${total}`;
  $('#rdBar').style.width=(total?n/total*100:0)+'%';
}
function renderFaq(){
  $('#faqList').innerHTML=FAQ.map(f=>`<details><summary>${tr(f[0])}</summary><p>${tr(f[1])}</p></details>`).join('');
}
function renderContact(){
  $('#fTopic').innerHTML=TOPICS.map(t=>`<option>${tr(t)}</option>`).join('');
  $('#ctInfo').innerHTML=[['✉️','hello@example.com'],['📞','+7 700 000 00 00'],['📍',tr(["Алматы / Астана / онлайн","Алматы / Астана / онлайн","Almaty / Astana / online"])],['🕘',tr(["Пн–Пт, 10:00–18:00","Дс–Жм, 10:00–18:00","Mon to Fri, 10:00 to 18:00"])]].map(r=>`<span class="tag y" style="font-size:1rem;padding:8px 16px">${r[0]} ${r[1]}</span>`).join('');
}

/* quiz */
let qs={step:0,score:{}};
function renderQuiz(){
  const box=$('#quizBox');
  if(qs.step>=QUIZ.length){
    const top=Object.entries(qs.score).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>PATHS.find(p=>p.k===e[0]));
    box.innerHTML=`<h3>🎉 ${tr(UI.q_res)}</h3><div class="res">${top.map(p=>`<div class="r"><span class="ico">${p.e}</span><div><b>${tr(p.n)}</b>${tr(p.d)}</div><a class="btn sm" href="${p.to}">${tr(UI.q_open)}</a></div>`).join('')}</div><p style="margin-top:18px"><button class="btn ghost sm" id="qAgain">${tr(UI.q_again)}</button></p>`;
    return;
  }
  const q=QUIZ[qs.step];
  box.innerHTML=`<div class="bar"><i style="width:${qs.step/QUIZ.length*100}%"></i></div><small style="font-weight:800">${tr(UI.q_step)} ${qs.step+1}/${QUIZ.length}</small><h3>${tr(q.q)}</h3><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-q="${i}">${tr(o[0])}</button>`).join('')}</div>`;
}

function renderAll(){
  applyStatic();renderMenu();renderHero();renderPaths();renderGallery();renderQuiz();renderUni();renderSch();renderGov();renderFr();renderCrs();renderJob();renderGl();renderLng();renderSto();renderMen();renderPrc();renderRoad();renderFaq();renderContact();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');
  if(!t) return;
  if(t.dataset.lang){lang=t.dataset.lang;store.set('lang',lang);renderAll();return}
  if(t.dataset.cur){cur=t.dataset.cur;renderAll();return}
  if(t.dataset.f){F[t.dataset.f]=t.dataset.v;({uni:renderUni,crs:renderCrs,job:renderJob,fr:renderFr,gl:renderGl})[t.dataset.f]();return}
  if(t.dataset.q!==undefined){
    const o=QUIZ[qs.step].o[+t.dataset.q][1];
    for(const k in o) qs.score[k]=(qs.score[k]||0)+o[k];
    qs.step++;renderQuiz();return;
  }
  if(t.id==='qAgain'){qs={step:0,score:{}};renderQuiz();return}
  if(t.dataset.copy){
    const txt=t.dataset.copy,done=()=>{t.textContent=tr(UI.copied);setTimeout(()=>t.textContent=tr(UI.copy),1600)};
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done,done); else done();
    return;
  }
  if(t.id==='menuBtn'){const p=$('#menuPanel');p.hidden=!p.hidden;t.setAttribute('aria-expanded',!p.hidden);return}
  if(t.closest('#menuPanel')){$('#menuPanel').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false')}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.road){
    const d=loadRoad();d[e.target.dataset.road]=e.target.checked;store.set('roadDone',JSON.stringify(d));
    const all=document.querySelectorAll('[data-road]');
    updRoad([...all].filter(i=>i.checked).length,all.length);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#menuPanel').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false')}});
$('#ctForm').addEventListener('submit',e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  const body=`${f.get('msg')||''}\n\n— ${f.get('name')} (${f.get('mail')})`;
  location.href=`mailto:hello@example.com?subject=${encodeURIComponent(f.get('topic'))}&body=${encodeURIComponent(body)}`;
  $('#thanks').style.display='block';
});

/* ---------- init ---------- */
const saved=store.get('lang');
if(saved&&IDX[saved]!==undefined) lang=saved;
else{const nl=(navigator.language||'').toLowerCase();if(nl.startsWith('kk'))lang='kz';else if(nl.startsWith('en'))lang='en'}
renderAll();
</script>
</body>
</html>
